# Cloudflare Worker that hosts First Shift online: the game, accounts, saves
# and menu import. Everything here fits Cloudflare's free tier.
name = "first-shift"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# The whole game is one HTML file (npm run build:file) bundled into the
# Worker itself, so there are no separate files to upload.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# Accounts and saves. database_id is filled in when the database is created.
[[d1_databases]]
binding = "DB"
database_name = "first-shift"
database_id = "25ecf07b-cca7-498f-b750-c47440fd7cb8"

# AI that reads imported menus (Workers AI, free daily allowance).
[ai]
binding = "AI"

[vars]
DAILY_IMPORTS = "10"

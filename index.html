<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>First Shift</title>
</head>
<body>
  <canvas id="scene" aria-label="The restaurant floor. Tap the floor to walk there."></canvas>

  <header class="hud" id="hud">
    <div class="brand"><b>First Shift</b><span id="hudLang">Spanish</span></div>
    <div class="stats">
      <div class="stat"><span class="sr-only">Time </span><strong id="hudClock">6:00 PM</strong></div>
      <div class="stat">Guests <strong id="hudGuests">0/5</strong></div>
      <div class="stat">Tips <strong id="hudTips">$0.00</strong></div>
      <button class="stat" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
      <button class="stat" id="menuBtn" type="button">Menu</button>
      <button class="stat" id="pauseBtn" type="button" aria-label="Pause the game">Pause</button>
    </div>
  </header>

  <div class="action" id="action" hidden>
    <button id="actionBtn" type="button" aria-disabled="true">
      <span class="what"><span id="actionLabel"></span><kbd id="actionKey" hidden>E</kbd></span>
      <span class="hint" id="actionHint"></span>
    </button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
